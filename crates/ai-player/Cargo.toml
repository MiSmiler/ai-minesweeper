[package]
name = "ai-player"
version = "0.1.0"
edition = "2024"

[dependencies]
agent = { path = "../agent" }
base64 = "0.22"
futures = "0.3"
game = { path = "../game" }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
game = { path = "../game", features = ["test-support"] }
