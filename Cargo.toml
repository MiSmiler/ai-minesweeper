[package]
name = "ai-minesweeper"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]

[dependencies]
agent = { path = "crates/agent" }
ai-player = { path = "crates/ai-player" }
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
game = { path = "crates/game" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.7.0", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The game crate's test-support constructors (`Game::with_mines`).
game = { path = "crates/game", features = ["test-support"] }
# A test provider implements the `agent::Provider` async trait.
async-trait = "0.1"
