<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper — AI</title>
  </head>
  <body>
    <div id="app">
      <nav class="page-nav" aria-label="Pages">
        <a class="page-nav-link" data-nav href="/">Human</a>
        <span class="page-nav-link active" aria-current="page">AI</span>
      </nav>
      <div class="difficulty-row">
        <button class="difficulty" data-difficulty="beginner">Beginner</button>
        <button class="difficulty" data-difficulty="intermediate">
          Intermediate
        </button>
        <button class="difficulty" data-difficulty="expert">Expert</button>
      </div>
      <div class="game-frame">
        <div class="top-bar">
          <div id="counter" class="led"></div>
          <button id="smiley" class="smiley" aria-label="New game">🙂</button>
          <div id="timer" class="led"></div>
        </div>
        <div id="board"></div>
      </div>
      <section id="ai-panel" class="ai-panel" aria-label="AI assistant">
        <h2 class="ai-panel-title">AI Assistant</h2>
        <textarea
          id="ai-transcript"
          class="ai-transcript"
          readonly
          placeholder="The AI's Board analysis will appear here."
        ></textarea>
      </section>
    </div>
    <script type="module" src="/src/aiMain.ts"></script>
  </body>
</html>
