<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper — AI player</title>
  </head>
  <body>
    <nav class="page-nav">
      <a data-nav href="/">回到人工玩法</a>
    </nav>
    <div id="app">
      <div class="difficulty-row">
        <button class="difficulty" data-difficulty="beginner">Beginner</button>
        <button class="difficulty" data-difficulty="intermediate">
          Intermediate
        </button>
        <button class="difficulty" data-difficulty="expert">Expert</button>
      </div>
      <div class="game-frame">
        <div class="top-bar">
          <div id="counter" class="led"></div>
          <button id="smiley" class="smiley" aria-label="New game">🙂</button>
          <div id="timer" class="led"></div>
        </div>
        <div id="board"></div>
      </div>
      <section id="ai-panel" class="ai-panel">
        <h2>DeepSeek 分析</h2>
        <p class="ai-panel-placeholder">DeepSeek 的推理与回答将显示在这里。</p>
      </section>
    </div>
    <script type="module" src="/src/ai/main.ts"></script>
  </body>
</html>
